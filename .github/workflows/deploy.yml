name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup swap space (16GB to prevent esbuild OOM)
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          NEXT_PUBLIC_COS_BASE_URL: /api/media
          NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

      - name: Build OpenNext bundle (with minification)
        run: npx opennextjs-cloudflare build --skipNextBuild
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          NEXT_PUBLIC_COS_BASE_URL: /api/media
          NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

      - name: Replace unnecessary Prisma WASM engines with empty files
        run: |
          echo "Replacing PostgreSQL and MySQL WASM engines with empty files (only SQLite is needed)..."
          # Use empty files instead of deleting to avoid ENOENT import errors
          echo -n "" > .open-next/server-functions/default/node_modules/@prisma/client/runtime/query_engine_bg.postgresql.wasm 2>/dev/null || true
          echo -n "" > .open-next/server-functions/default/node_modules/@prisma/client/runtime/query_engine_bg.mysql.wasm 2>/dev/null || true
          echo "WASM files after replacement:"
          find .open-next/server-functions/default -name "*.wasm" -exec ls -lh {} \;

      - name: Check handler.mjs size before deploy
        run: |
          cd .open-next/server-functions/default
          echo "handler.mjs size:"
          ls -lh handler.mjs
          echo "Gzip compressed size (Cloudflare will use similar compression):"
          gzip -c handler.mjs | wc -c | awk '{printf "%.1f MB\n", $1/1024/1024}'

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
