#:schema node_modules/wrangler/config-schema.json
name = "zhiyin"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

# Pages build output directory (required for `wrangler pages deploy` to honor this file)
pages_build_output_dir = ".open-next/assets"

# D1 Database binding (free, serverless SQLite)
[[d1_databases]]
binding = "DB"
database_name = "zhiyin-db"
database_id = "d44c1d6f-0ce5-4dc6-8d91-43eece14f5d6"

# Observability
[observability]
enabled = true