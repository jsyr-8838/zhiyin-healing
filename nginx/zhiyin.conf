# =============================================================================
# ZhiYin (知音) - Nginx Reverse Proxy Configuration
# Provides: HTTPS encryption, security headers, rate limiting, IP filtering
# Usage: Copy to /etc/nginx/sites-available/zhiyin, symlink to sites-enabled
# =============================================================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=zhiyin_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=zhiyin_general:10m rate=30r/s;

upstream zhiyin_backend {
    server 127.0.0.1:3456;
    keepalive 32;
}

server {
    # ── HTTP to HTTPS redirect ──
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # Change to your domain

    # ── SSL certificates (use Let's Encrypt, free) ──
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # ── SSL hardening ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # ── Body size limit (for file uploads like tongue images) ──
    client_max_body_size 10m;

    # ── Main application ──
    location / {
        limit_req zone=zhiyin_general burst=20 nodelay;
        proxy_pass http://zhiyin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout for AI endpoints (long-running streaming)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── API endpoints (stricter rate limiting) ──
    location /api/ {
        limit_req zone=zhiyin_api burst=5 nodelay;
        proxy_pass http://zhiyin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ── Static assets (long cache) ──
    location /_next/static/ {
        proxy_pass http://zhiyin_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Block sensitive paths ──
    location ~ /\. {
        deny all;
    }
    location ~ /\.env {
        deny all;
    }
}
